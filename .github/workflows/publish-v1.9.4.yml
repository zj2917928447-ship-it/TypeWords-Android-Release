name: Publish TypeWords Android v1.9.4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download exact release artifacts
        env:
          DOWNLOAD_BASE: https://pts-decreased-acids-excess.trycloudflare.com
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 "$DOWNLOAD_BASE/download" -o TypeWords-Android-v1.9.4.apk
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 "$DOWNLOAD_BASE/sha256" -o TypeWords-Android-v1.9.4.apk.sha256
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 "$DOWNLOAD_BASE/source" -o TypeWords-Android-v1.9.4-source.zip
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 "$DOWNLOAD_BASE/source-sha256" -o TypeWords-Android-v1.9.4-source.zip.sha256

          sha256sum --check TypeWords-Android-v1.9.4.apk.sha256
          sha256sum --check TypeWords-Android-v1.9.4-source.zip.sha256
          test "$(stat -c '%s' TypeWords-Android-v1.9.4.apk)" = "31604588"
          test "$(stat -c '%s' TypeWords-Android-v1.9.4-source.zip)" = "31910607"
          unzip -tq TypeWords-Android-v1.9.4-source.zip

      - name: Prepare release notes
        run: |
          cat > release-notes.md <<'EOF'
          TypeWords Android v1.9.4

          Independent Android adaptation of TypeWords (not an official upstream release).

          - Android package: cc.typewords.android
          - versionName: 1.9.4
          - versionCode: 24
          - Minimum Android: 6.0
          - Preserves FSRS-6, review history, IndexedDB learning data and ZIP backup format.
          - Adds an offline US IPA overlay for 14,382 bundled headwords, with locale-aware pronunciation display and optional phoneme / stress hints.
          - Hardens PWA offline caching: query-bearing root URLs are not cached, core app shell entries survive the 400-item cache cap, and online deep-link 404s fall back to the SPA shell.
          - Android asset staging now uses an isolated staging directory and safe swap, preserving the previous assets if copying fails.
          - Complete corresponding GPL-3.0 source archive and SHA-256 files are attached.

          APK SHA-256: d1ea3d1c7622c3a8ae903ddfd7172d7362b1230cc6422bc63f061a640b126485
          Source ZIP SHA-256: a74ff656c587ebe0382b434c4c0e20e676737a754b26c60c1e55775e5face39c

          Upgrade safely: export and verify an in-app ZIP backup before installing over an existing version. In-place update requires the same package name and signing certificate. Never uninstall the old app to troubleshoot a signature mismatch.
          EOF

      - name: Refuse accidental overwrite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.9.4 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.9.4 already exists; refusing to overwrite any existing release or asset."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v1.9.4 >/dev/null 2>&1; then
            echo "Tag v1.9.4 already exists; refusing to overwrite it."
            exit 1
          fi

      - name: Create public GitHub Release and upload verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.9.4 \
            TypeWords-Android-v1.9.4.apk \
            TypeWords-Android-v1.9.4.apk.sha256 \
            TypeWords-Android-v1.9.4-source.zip \
            TypeWords-Android-v1.9.4-source.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "TypeWords Android v1.9.4" \
            --notes-file release-notes.md \
            --latest

      - name: Verify release assets and public downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v1.9.4 --repo "$GITHUB_REPOSITORY" --json url,tagName,assets
          mkdir -p downloaded
          for asset in \
            TypeWords-Android-v1.9.4.apk \
            TypeWords-Android-v1.9.4.apk.sha256 \
            TypeWords-Android-v1.9.4-source.zip \
            TypeWords-Android-v1.9.4-source.zip.sha256; do
            gh release download v1.9.4 --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir downloaded
          done
          (cd downloaded && sha256sum --check TypeWords-Android-v1.9.4.apk.sha256)
          (cd downloaded && sha256sum --check TypeWords-Android-v1.9.4-source.zip.sha256)
