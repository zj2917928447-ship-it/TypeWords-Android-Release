name: Repair TypeWords v1.9.4 GPL source asset

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-source-asset:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and verify current corresponding source archive
        env:
          DOWNLOAD_BASE: https://pts-decreased-acids-excess.trycloudflare.com
          EXPECTED_SHA256: 4932e58285764a0819f42ec2af774d9e274f57c60feaaf0db2b28c60f7a2d91d
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 "$DOWNLOAD_BASE/source" -o TypeWords-Android-v1.9.4-source-current.zip
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 "$DOWNLOAD_BASE/source-sha256" -o TypeWords-Android-v1.9.4-source-current.zip.sha256
          echo "$EXPECTED_SHA256  TypeWords-Android-v1.9.4-source-current.zip" > expected.sha256
          sha256sum --check expected.sha256
          test "$(stat -c '%s' TypeWords-Android-v1.9.4-source-current.zip)" = "31912978"
          unzip -tq TypeWords-Android-v1.9.4-source-current.zip
          unzip -Z1 TypeWords-Android-v1.9.4-source-current.zip | grep -Fx 'TypeWords-Android/tools/vendor/ipa-dict/en_US.txt'
          unzip -Z1 TypeWords-Android-v1.9.4-source-current.zip | grep -Fx 'TypeWords-Android/docs/github-research-20261115.md'
          unzip -Z1 TypeWords-Android-v1.9.4-source-current.zip | grep -Fx 'TypeWords-Android/tools/start_typewords_public_download.ps1'

      - name: Upload replacement assets before touching the existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA256: 4932e58285764a0819f42ec2af774d9e274f57c60feaaf0db2b28c60f7a2d91d
        run: |
          set -euo pipefail
          gh release upload v1.9.4 \
            TypeWords-Android-v1.9.4-source-current.zip \
            TypeWords-Android-v1.9.4-source-current.zip.sha256 \
            --repo "$GITHUB_REPOSITORY"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.9.4" > release.json
          NEW_ZIP_ID="$(jq -r '.assets[] | select(.name=="TypeWords-Android-v1.9.4-source-current.zip") | .id' release.json)"
          NEW_SHA_ID="$(jq -r '.assets[] | select(.name=="TypeWords-Android-v1.9.4-source-current.zip.sha256") | .id' release.json)"
          NEW_DIGEST="$(jq -r '.assets[] | select(.name=="TypeWords-Android-v1.9.4-source-current.zip") | .digest' release.json)"
          NEW_SIZE="$(jq -r '.assets[] | select(.name=="TypeWords-Android-v1.9.4-source-current.zip") | .size' release.json)"
          test -n "$NEW_ZIP_ID" && test -n "$NEW_SHA_ID"
          test "$NEW_DIGEST" = "sha256:$EXPECTED_SHA256"
          test "$NEW_SIZE" = "31912978"

      - name: Replace stale source assets only after the new archive is verified
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA256: 4932e58285764a0819f42ec2af774d9e274f57c60feaaf0db2b28c60f7a2d91d
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.9.4" > release.json
          OLD_ZIP_ID="$(jq -r '.assets[] | select(.name=="TypeWords-Android-v1.9.4-source.zip") | .id' release.json)"
          OLD_SHA_ID="$(jq -r '.assets[] | select(.name=="TypeWords-Android-v1.9.4-source.zip.sha256") | .id' release.json)"
          NEW_ZIP_ID="$(jq -r '.assets[] | select(.name=="TypeWords-Android-v1.9.4-source-current.zip") | .id' release.json)"
          NEW_SHA_ID="$(jq -r '.assets[] | select(.name=="TypeWords-Android-v1.9.4-source-current.zip.sha256") | .id' release.json)"
          test -n "$OLD_ZIP_ID" && test -n "$OLD_SHA_ID"
          test -n "$NEW_ZIP_ID" && test -n "$NEW_SHA_ID"

          gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$OLD_ZIP_ID"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$OLD_SHA_ID"

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$NEW_ZIP_ID" -f name="TypeWords-Android-v1.9.4-source.zip" >/dev/null
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$NEW_SHA_ID" -f name="TypeWords-Android-v1.9.4-source.zip.sha256" >/dev/null

          gh release download v1.9.4 --repo "$GITHUB_REPOSITORY" --pattern 'TypeWords-Android-v1.9.4-source.zip' --dir verified
          gh release download v1.9.4 --repo "$GITHUB_REPOSITORY" --pattern 'TypeWords-Android-v1.9.4-source.zip.sha256' --dir verified
          (cd verified && sha256sum --check TypeWords-Android-v1.9.4-source.zip.sha256)
          test "$(sha256sum verified/TypeWords-Android-v1.9.4-source.zip | cut -d' ' -f1)" = "$EXPECTED_SHA256"

      - name: Update release notes to the verified source digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit v1.9.4 --repo "$GITHUB_REPOSITORY" --notes 'TypeWords Android v1.9.4

          Independent Android adaptation of TypeWords (not an official upstream release).

          - Android package: cc.typewords.android
          - versionName: 1.9.4
          - versionCode: 24
          - Minimum Android: 6.0
          - Preserves FSRS-6, review history, IndexedDB learning data and ZIP backup format.
          - Adds offline US IPA for 14,382 bundled headwords, locale-aware pronunciation display and optional phoneme / stress hints.
          - Hardens PWA offline caching: query-bearing root URLs are not cached, core app shell entries survive the 400-item cache cap, and online deep-link 404s fall back to the SPA shell.
          - Android asset staging uses an isolated staging directory and safe swap.
          - Complete corresponding GPL-3.0 source archive and SHA-256 files are attached.

          APK SHA-256: d1ea3d1c7622c3a8ae903ddfd7172d7362b1230cc6422bc63f061a640b126485
          Source ZIP SHA-256: 4932e58285764a0819f42ec2af774d9e274f57c60feaaf0db2b28c60f7a2d91d

          Upgrade safely: export and verify an in-app ZIP backup before installing over an existing version. In-place update requires the same package name and signing certificate. Never uninstall the old app to troubleshoot a signature mismatch.'
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.9.4" > final-release.json
          test "$(jq -r '.assets[] | select(.name=="TypeWords-Android-v1.9.4-source.zip") | .digest' final-release.json)" = "sha256:4932e58285764a0819f42ec2af774d9e274f57c60feaaf0db2b28c60f7a2d91d"
          test "$(jq -r '.assets[] | select(.name=="TypeWords-Android-v1.9.4-source.zip.sha256") | .state' final-release.json)" = "uploaded"
          echo "TYPEWORDS_V194_SOURCE_ASSET_REPAIR_PASS"
